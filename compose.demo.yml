# Демо: виртуальные часы идут с 28.10.2025 03:00 до 04.11.2025 23:00, данные есть до 01.11.
# С первой минуты «сегодня» — школьные каникулы (25.10–02.11), дальше рабочая суббота 01.11
# и праздник 03–04.11: слайдеры праздников и каникул видны на текущих днях.
# CLOCK_END не позже 04.11: водяной знак останавливается на 01.11, а с 05.11 разница больше
# 3 дней и бэкенд пометил бы данные устаревшими.
# CLOCK_SPEED=750: весь путь — около 15 мин; прогон ансамбля (~4.5 мин, 2 CPU) — это ~2.3
# виртуальных суток, на столько прогноз может отставать от «сейчас».
# Стартовый прогноз ml/seed/ собран под этот CLOCK_START (`make seed`), при смене даты — пересобрать.
# Часы пишутся в state/clock.json при первом старте: `make demo` сбрасывает тома демо и запускает их заново.

services:
  ingest:
    environment:
      CLOCK_START: "2025-10-28T03:00:00"
      CLOCK_END: "2025-11-04T23:00:00"
      CLOCK_SPEED: "750"
      INGEST_POLL_SEC: "5"

  ml-worker:
    environment:
      CLOCK_START: "2025-10-28T03:00:00"
      CLOCK_SPEED: "750"
      CLOCK_END: "2025-11-04T23:00:00"
      MIN_RERUN_MINUTES: "2"
      WORKER_POLL_SEC: "10"
