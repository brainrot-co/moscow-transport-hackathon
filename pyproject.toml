[project]
name = "moscow-transport-hackathon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chronos-forecasting>=2.0",
    "duckdb==1.5.5",
    "folium==0.20.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ARG", "ERA", "BLE", "ANN001", "ANN002", "ANN003"]

[tool.ruff.lint.isort]
known-first-party = ["mtml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["ml/tests"]

[tool.hatch.build.targets.wheel]
packages = ["ml/src/mtml"]
