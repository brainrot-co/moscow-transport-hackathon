<text x="994" y="1042" font-size="14" font-weight="600" fill="#1f2426">meta.json</text>
<text x="994" y="1064" font-size="12.5" fill="#5f686c">model = ensemble_cal_school_daytype_profile</text>
<text x="994" y="1082" font-size="12.5" fill="#5f686c">ковариаты, квантили, проверки качества</text>
