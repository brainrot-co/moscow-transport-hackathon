<text x="34" y="252" font-size="13" font-weight="700" letter-spacing="1" fill="#5f686c">УЧАСТНИКИ АНСАМБЛЯ · каждый получает историю, свою часть ковариат и общие веса</text>
<rect x="40" y="262" width="300" height="506" rx="9" fill="#ffffff" stroke="#2c6a6e" stroke-width="2"/>
<text x="54" y="288" font-size="16" font-weight="600" fill="#1f2426">RH · вес 1/3</text>
<text x="54" y="310" font-size="12.5" fill="#5f686c">Chronos2Forecaster, route_hour_daily</text>
<text x="54" y="328" font-size="12.5" fill="#5f686c">216 рядов = 9 маршрутов × 24 часа</text>
<text x="54" y="346" font-size="12.5" fill="#5f686c">ряд: посадки в этот час по дням</text>
<text x="54" y="364" font-size="12.5" fill="#5f686c">горизонт 61 шаг (день)</text>
<text x="54" y="382" font-size="12.5" fill="#5f686c"></text>
<text x="54" y="400" font-size="12.5" fill="#5f686c">ковариаты на горизонте:</text>
<text x="54" y="418" font-size="12.5" fill="#5f686c">· is_non_working</text>
<text x="54" y="436" font-size="12.5" fill="#5f686c">· is_holiday_weekday</text>
<text x="54" y="454" font-size="12.5" fill="#5f686c">· is_shortened</text>
<text x="54" y="472" font-size="12.5" fill="#5f686c">· school_holiday_modular</text>
<text x="54" y="490" font-size="12.5" fill="#5f686c">· school_holiday_quarter</text>
<text x="54" y="508" font-size="12.5" fill="#5f686c"></text>
<text x="54" y="526" font-size="12.5" fill="#5f686c"></text>
<text x="54" y="544" font-size="12.5" fill="#5f686c"></text>
<text x="54" y="562" font-size="12.5" fill="#5f686c">выход: медиана, q10, q90</text>
<text x="54" y="580" font-size="12.5" fill="#5f686c">= chronos2_daily_cal_school</text>
<rect x="360" y="262" width="300" height="506" rx="9" fill="#ffffff" stroke="#2c6a6e" stroke-width="2"/>
