<text x="34" y="826" font-size="13" font-weight="700" letter-spacing="1" fill="#5f686c">ENSEMBLEFORECASTER</text>
<rect x="40" y="842" width="900" height="100" rx="9" fill="#ffffff" stroke="#b3302a" stroke-width="2"/>
<text x="54" y="868" font-size="16" font-weight="600" fill="#1f2426">yhat = (RH + RHD + V2) / 3</text>
<text x="54" y="890" font-size="12.5" fill="#5f686c">q10, q90 = среднее по RH и RHD (у V2 квантилей нет)</text>
<text x="54" y="908" font-size="12.5" fill="#5f686c">одна таблица ковариат на всех: подмена covariates доходит до каждого участника</text>
<rect x="960" y="842" width="484" height="100" rx="9" fill="#ffffff" stroke="#737b7f" stroke-width="2"/>
<text x="974" y="868" font-size="14" font-weight="600" fill="#1f2426">Итоговые веса</text>
<text x="974" y="890" font-size="12.5" fill="#5f686c">RH 1/3 · RHD 1/3</text>
<text x="974" y="908" font-size="12.5" fill="#5f686c">профиль 1/9 · суммы без ковариат 1/9 · суммы + календарь 1/9</text>
