<text x="374" y="310" font-size="12.5" fill="#5f686c">Chronos2Forecaster, route_hour_daily</text>
<text x="374" y="328" font-size="12.5" fill="#5f686c">216 рядов = 9 маршрутов × 24 часа</text>
<text x="374" y="346" font-size="12.5" fill="#5f686c">ряд: посадки в этот час по дням</text>
<text x="374" y="364" font-size="12.5" fill="#5f686c">горизонт 61 шаг (день)</text>
<text x="374" y="382" font-size="12.5" fill="#5f686c"></text>
<text x="374" y="400" font-size="12.5" fill="#5f686c">ковариаты на горизонте:</text>
<text x="374" y="418" font-size="12.5" fill="#5f686c">· is_non_working</text>
<text x="374" y="436" font-size="12.5" fill="#5f686c">· is_holiday_weekday</text>
<text x="374" y="454" font-size="12.5" fill="#5f686c">· is_shortened</text>
<text x="374" y="472" font-size="12.5" fill="#5f686c">· school_holiday_modular</text>
<text x="374" y="490" font-size="12.5" fill="#5f686c">· school_holiday_quarter</text>
<text x="374" y="508" font-size="12.5" fill="#5f686c">· day_type</text>
<text x="374" y="526" font-size="12.5" fill="#5f686c"></text>
<text x="374" y="544" font-size="12.5" fill="#5f686c"></text>
<text x="374" y="562" font-size="12.5" fill="#5f686c">выход: медиана, q10, q90</text>
<text x="374" y="580" font-size="12.5" fill="#5f686c">= chronos2_daily_cal_school_daytype</text>
