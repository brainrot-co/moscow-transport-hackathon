<text x="54" y="1042" font-size="14" font-weight="600" fill="#1f2426">forecasts.parquet</text>
<text x="54" y="1064" font-size="12.5" fill="#5f686c">route, ts, yhat, q10, q90 · 61 день почасово</text>
<text x="54" y="1082" font-size="12.5" fill="#5f686c">маршрут 5 без истории → 0 (cold start)</text>
<rect x="500" y="1016" width="460" height="76" rx="9" fill="#ffffff" stroke="#737b7f" stroke-width="2"/>
<text x="514" y="1042" font-size="14" font-weight="600" fill="#1f2426">effects.parquet</text>
<text x="514" y="1064" font-size="12.5" fill="#5f686c">контрольные прогоны ансамбля без праздников</text>
<text x="514" y="1082" font-size="12.5" fill="#5f686c">и без каникул → log_effect для слайдеров</text>
