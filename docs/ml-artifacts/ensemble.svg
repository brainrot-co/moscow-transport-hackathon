<text x="961" y="620" font-size="12.5" fill="#5f686c">сумма дня × доли часов профиля;</text>
<text x="961" y="638" font-size="12.5" fill="#5f686c">в special-дни и при простое маршрута (&lt; 5%) — сумма профиля</text>
