<text x="714" y="706" font-size="13" font-weight="600" fill="#1f2426">Среднее трёх вариантов → × new_year_factor</text>
<text x="714" y="728" font-size="12.5" fill="#5f686c">будни 27–31.12 × ≈ 0.90: первые рабочие дни последнего января к трём следующим неделям</text>
