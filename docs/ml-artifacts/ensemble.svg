<rect x="680" y="262" width="764" height="506" rx="9" fill="#f7fafa" stroke="#5f686c" stroke-width="2"/>
<text x="694" y="288" font-size="16" font-weight="600" fill="#1f2426">V2 · ProfileDailyForecaster · вес 1/3</text>
<rect x="700" y="306" width="724" height="66" rx="9" fill="#ffffff" stroke="#737b7f" stroke-width="2"/>
<text x="714" y="332" font-size="13" font-weight="600" fill="#1f2426">day_features: признаки дня из календаря</text>
<text x="714" y="354" font-size="12.5" fill="#5f686c">dow · work_weekend (рабочая Сб/Вс) · special = праздник в будни или рабочий выходной</text>
<rect x="700" y="392" width="230" height="156" rx="9" fill="#ffffff" stroke="#737b7f" stroke-width="2"/>
<text x="714" y="418" font-size="13" font-weight="600" fill="#1f2426">Недельный профиль (без ML)</text>
<text x="714" y="440" font-size="12.5" fill="#5f686c">уровень: медиана Пн–Чт за 7 дн</text>
<text x="714" y="458" font-size="12.5" fill="#5f686c">× коэф. дня недели за 6 нед</text>
<text x="714" y="476" font-size="12.5" fill="#5f686c">доли часов: за 4 недели</text>
<text x="714" y="494" font-size="12.5" fill="#5f686c">праздник → как воскресенье</text>
<text x="714" y="512" font-size="12.5" fill="#5f686c">раб. суббота → (Пт + Сб) / 2</text>
<rect x="947" y="392" width="230" height="156" rx="9" fill="#ffffff" stroke="#2c6a6e" stroke-width="2"/>
<text x="961" y="418" font-size="13" font-weight="600" fill="#1f2426">Chronos-2: суммы за день</text>
<text x="961" y="440" font-size="12.5" fill="#5f686c">9 рядов — по маршруту</text>
<text x="961" y="458" font-size="12.5" fill="#5f686c">горизонт 61 день</text>
<text x="961" y="476" font-size="12.5" fill="#5f686c">ковариат нет</text>
<text x="961" y="494" font-size="12.5" fill="#5f686c">медиана</text>
<rect x="1194" y="392" width="230" height="156" rx="9" fill="#ffffff" stroke="#2c6a6e" stroke-width="2"/>
<text x="1208" y="418" font-size="13" font-weight="600" fill="#1f2426">Chronos-2: суммы + календарь</text>
<text x="1208" y="440" font-size="12.5" fill="#5f686c">9 рядов — по маршруту</text>
<text x="1208" y="458" font-size="12.5" fill="#5f686c">на горизонте:</text>
<text x="1208" y="476" font-size="12.5" fill="#5f686c">is_non_working,</text>
<text x="1208" y="494" font-size="12.5" fill="#5f686c">is_holiday_weekday, dow</text>
<text x="1208" y="512" font-size="12.5" fill="#5f686c">медиана</text>
