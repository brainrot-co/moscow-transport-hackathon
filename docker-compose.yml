  #     DATA_DIR: /data
  #   volumes:
  #     - tram-data:/data:ro     # том только на чтение: прогноз, факты, часы, эффекты
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - ml-worker
  #
  # frontend:
  #   build: ./frontend
  #   restart: unless-stopped
  #   ports:
  #     - "3000:80"
  #   depends_on:
  #     - backend

volumes:
  tram-data:
  postgres-data:
